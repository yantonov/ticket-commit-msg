name: release

on:
  push:
    tags:
      - '*'

jobs:
  publish:
    # define multiple targets
    name: Publish for ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            executable: ticket-commit-msg
            asset_name: ticket-commit-msg-linux
          - os: windows-latest
            executable: ticket-commit-msg.exe
            asset_name: ticket-commit-msg-windows
          - os: macos-latest
            executable: ticket-commit-msg
            asset_name: ticket-commit-msg-macos

    # build
    steps:
      - name: checkout
        uses: actions/checkout@v7

      - name: enable toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: build
        run: cargo build --release

      - name: Set enviroment for github-release
        run: |
          echo "RELEASE_TAG=$( echo ${GITHUB_REF##*/} )" >> $GITHUB_ENV

      - name: create archive
        uses: master-atul/tar-action@v1.0.2
        with:
          command: c
          cwd: ./target/release/
          files: |
            ${{ matrix.executable }}
          outPath: target/release/${{ matrix.asset_name }}-${{ env.RELEASE_TAG }}.tar.gz

      - name: checksum
        run: |
          cd target/release
          archive="${{ matrix.asset_name }}-${{ env.RELEASE_TAG }}.tar.gz"
          # linux and git bash carry sha256sum, macos carries shasum
          if command -v sha256sum > /dev/null 2>&1; then
            sha256sum "${archive}" > "${archive}.sha256"
          else
            shasum -a 256 "${archive}" > "${archive}.sha256"
          fi
          cat "${archive}.sha256"

      - name: Release
        uses: softprops/action-gh-release@v1
        with:
          draft: true
          files: |
            target/release/${{ matrix.asset_name }}-${{ env.RELEASE_TAG }}.tar.gz
            target/release/${{ matrix.asset_name }}-${{ env.RELEASE_TAG }}.tar.gz.sha256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
